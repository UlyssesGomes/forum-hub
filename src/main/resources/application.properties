spring.application.name=forum_hub

--spring.datasource.url=jdbc:mysql://localhost/forum_hub?createDatabaseIfNotExist=true
--spring.datasource.username=root
--spring.datasource.password=root

spring.datasource.url=jdbc:h2:mem:sua-estampa-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


app.jwt-issuer=ForumHub
app.jwt-secret=${JWT_SECRET}

app.github.clientId=${GITHUB_CLIENT_ID}
app.github.secret=${GITHUB_SECRET}
app.github.callback=http://localhost:8080/login/github/authorized
